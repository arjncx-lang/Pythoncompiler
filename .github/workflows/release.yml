name: Release APK

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13 (Chaquopy build Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Build release APK (all ABIs)
        run: ./gradlew assembleRelease -PchaquopyPython="${{ env.pythonLocation }}\python.exe"
        shell: bash

      - name: Locate APK
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
